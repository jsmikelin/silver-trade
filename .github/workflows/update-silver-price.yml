name: Update daily silver price

on:
  schedule:
    # Capture the previous completed UTC market day, Monday through Friday.
    - cron: "30 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-daily-silver-price
  cancel-in-progress: false

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install updater dependency
        run: python -m pip install "python-decouple>=3.0,<4.0"

      - name: Fetch daily XAG/USD history
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
        run: python scripts/update_silver_price.py --output api/live-price.json

      - name: Validate generated feed
        run: python -m json.tool api/live-price.json > /dev/null

      - name: Commit updated market data
        run: |
          if git diff --quiet -- api/live-price.json; then
            echo "The provider has not published a new completed daily value."
            exit 0
          fi
          git config user.name "Helin Silver Price Bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add api/live-price.json
          git commit -m "data: update daily silver price"
          git push

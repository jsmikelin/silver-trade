name: HTML regression checks

on:
  pull_request:
    paths:
      - '**.html'
      - '**.xml'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - 'verify_pr.py'
      - '.github/workflows/seo-auto-review.yml'
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify HTML, metadata, schemas, and article links
        run: |
          python -m unittest discover -s tests -v
          python verify_pr.py
